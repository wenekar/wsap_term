name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scripts/**'
      - 'tools/deploy/**'
      - 'tools/install/**'
      - 'tools/ab.sh'
      - 'tools/analyze.sh'
      - 'tools/build_macos_icon.py'
      - 'tools/generate_cards_font.py'
      - 'tools/loc_per_function.py'
      - 'tools/test-matrix.py'
      - '.clangd'
      - '.gitignore'
      - 'LICENSE'
      - 'Makefile'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scripts/**'
      - 'tools/deploy/**'
      - 'tools/install/**'
      - 'tools/ab.sh'
      - 'tools/analyze.sh'
      - 'tools/build_macos_icon.py'
      - 'tools/generate_cards_font.py'
      - 'tools/loc_per_function.py'
      - 'tools/test-matrix.py'
      - '.clangd'
      - '.gitignore'
      - 'LICENSE'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: macOS build and tests
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install llvm meson ninja pkgconf yyjson harfbuzz icu4c
      - name: Build and test
        run: bash tools/ci/build.sh
      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: macos-logs
          path: build/ci/meson-logs/
          if-no-files-found: ignore
          retention-days: 7

  linux:
    name: Linux build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-14 \
            g++-14 \
            pkg-config \
            ncurses-bin \
            libwayland-bin \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            libharfbuzz-dev \
            libicu-dev \
            libfreetype-dev \
            libfontconfig-dev \
            libglib2.0-dev \
            libx11-dev \
            libxi-dev \
            libxext-dev \
            libxrandr-dev \
            libdbus-1-dev \
            libegl1-mesa-dev \
            libvulkan-dev \
            fontconfig \
            fonts-dejavu \
            fonts-jetbrains-mono \
            fonts-noto-core \
            fonts-noto-cjk \
            fonts-noto-color-emoji
          python3 -m pip install --break-system-packages "meson>=1.12.0"
      - name: Install yyjson
        run: |
          git clone --depth 1 --branch 0.13.0 https://github.com/ibireme/yyjson.git /tmp/yyjson
          cmake -S /tmp/yyjson -B /tmp/yyjson/build -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/yyjson/build
          sudo cmake --install /tmp/yyjson/build
          sudo ldconfig
      - name: Build and test
        run: bash tools/ci/build.sh
      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: linux-logs
          path: build/ci/meson-logs/
          if-no-files-found: ignore
          retention-days: 7
