name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: macOS build and tests
    runs-on: [self-hosted, macOS, ARM64, wsap-term-macos]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Build and test
        run: bash tools/ci/build.sh
      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: macos-logs
          path: build/ci/meson-logs/
          if-no-files-found: ignore
          retention-days: 7

  linux:
    name: Linux build and tests
    if: vars.WSAP_LINUX_CI == 'true'
    runs-on: [self-hosted, Linux, wsap-term-linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Build and test
        run: bash tools/ci/build.sh
      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: linux-logs
          path: build/ci/meson-logs/
          if-no-files-found: ignore
          retention-days: 7
